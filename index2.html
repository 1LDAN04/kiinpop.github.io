<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MY CHAT ARCHIVE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{--bg:#E4F1E1;--bar:#F4FAF2;--bubble:#fff;--ink:#23352a;--sub:#6d8575;--accent:#5fa876;--line:#cfe3cb}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Noto Sans KR','Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}

/* 首頁 */
#home{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;gap:14px}
#home h1{font-size:26px;line-height:1.3;font-weight:700;margin-bottom:6px}
#home .note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:18px}
.menu{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;background:var(--bar);border-radius:16px;text-align:left;border:1px solid var(--line)}
.menu b{display:block;font-size:15px}.menu small{color:var(--sub);font-size:12px}

/* 頂部列 */
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:16px}.top .who small{font-size:12px;color:var(--accent)}
.top .ic{font-size:20px;padding:6px 8px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}

/* 聊天 */
#msgs{flex:1;overflow-y:auto;padding:14px 14px 24px}
.day{text-align:center;margin:18px 0 12px}
.day span{font-size:14px;color:#4a5f50;background:rgba(0,0,0,.06);padding:7px 20px;border-radius:999px;display:inline-block}
.row{display:flex;gap:12px;margin-bottom:6px;align-items:flex-start}
.row.first{margin-top:18px}
.row .avatar{width:48px;height:48px}.row .gap{width:48px;flex:none}
.col{max-width:calc(100% - 60px)}
.nick{display:flex;align-items:center;gap:6px;margin:0 0 6px 2px}
.nick b{font-size:15px;color:#111}
.nick .time{font-size:13px;color:var(--sub)}
.badge{width:17px;height:17px;border-radius:50%;background:#111;color:#fff;font-size:11px;line-height:17px;text-align:center;flex:none}
.line{display:block}
.bubble{display:inline-block;background:var(--bubble);padding:12px 20px;border-radius:24px;line-height:1.5;font-size:17px;word-break:break-word}
.bubble .zh{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:13px;color:var(--sub)}
.bubble.photo{padding:4px;background:var(--bubble)}
.bubble.reply{display:block;width:min(100%,460px);padding:16px 20px}
.reply .rh{font-size:13px;font-weight:700;margin-bottom:4px}
.reply .rq{font-size:15px;color:var(--sub);padding-bottom:12px;border-bottom:1px solid var(--line)}
.reply .ra{display:flex;gap:8px;padding-top:12px;font-size:17px}
.reply .arr{font-weight:700;flex:none}
.bubble.photo img{display:block;width:100%;max-width:240px;border-radius:12px;cursor:zoom-in}
.ph{width:200px;height:150px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--sub);background:var(--line);border-radius:12px;padding:10px}
.time{font-size:11px;color:var(--sub);white-space:nowrap}
.input{margin:8px 12px 12px;padding:11px 16px;background:var(--bar);border-radius:999px;color:var(--sub);font-size:14px;border:1px solid var(--line)}

/* 相簿 */
#photos{flex:1;overflow-y:auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid>*{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--line)}
.grid img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.empty{padding:40px 0;text-align:center;color:var(--sub);font-size:14px}

/* 側邊面板 */
.sheet{position:absolute;inset:0;z-index:5;display:flex;justify-content:flex-end;background:rgba(20,40,28,.35)}
.panel{width:78%;max-width:340px;height:100%;background:var(--bar);padding:20px 18px;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.panel h2{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.panel li{list-style:none}
.panel .d{width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.panel label{display:block;font-size:13px;color:var(--sub);margin:16px 0 6px}
.panel input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.sw{display:flex;gap:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--accent)}
.nav{display:flex;border-top:1px solid var(--line);background:var(--bar)}
.nav button{flex:1;padding:12px 0;font-size:20px}
.nav button.on{background:var(--bg)}
#lb{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<div class="app">

  <!-- 首頁 -->
  <section id="home">

    <button class="menu" data-go="date">📅 <span><b>날짜별 보기</b><small>依日期查看 · by date</small></span></button>
    <p class="note">‼️ 무단 캡쳐•복제•배포를 금지합니다.<br>請勿未經允許擷取、複製、轉載。<br><span id="contact"></span></p>
  </section>

  <!-- 聊天 / 相簿共用頂部 -->
  <header class="top" id="top" hidden>
    <button class="ic" data-go="home">‹</button>
    <img class="avatar" id="topAvatar" alt="">
    <div class="who"><b id="topName"></b><small id="topDays"></small></div>
    <button class="ic" data-go="date">📅</button>
    <button class="ic" id="openSet">☰</button>
  </header>

  <main id="msgs" hidden></main>
  <div class="input" id="fakeInput" hidden>Send a message ☺</div>
  <section id="photos" hidden></section>

  <nav class="nav" id="nav" hidden>
    <button data-go="home">🏠</button>
    <button data-go="chat">💌</button>
    <button data-go="photos">🖼️</button>
    <button data-go="date">📅</button>
  </nav>

  <!-- 日期面板 -->
  <div class="sheet" id="dateSheet" hidden>
    <div class="panel"><h2>by date 依日期 <button id="closeDate">✕</button></h2><ul id="dateList"></ul></div>
  </div>

  <!-- 設定面板 -->
  <div class="sheet" id="setSheet" hidden>
    <div class="panel">
      <h2><span></span><button id="closeSet">✕</button></h2>
      <div style="text-align:center;margin-bottom:6px">
        <img class="avatar" id="panelAvatar" alt="" style="width:84px;height:84px;margin:0 auto 10px;display:block">
        <b id="panelName" style="font-size:18px"></b>
        <div id="panelDays" style="font-size:13px;color:var(--accent);margin-top:4px"></div>
      </div>
      <label style="margin-top:22px">보관함 전체보기 查看全部</label>
      <button class="d" data-go="chat">💌 메시지 訊息</button>
      <button class="d" data-go="photos">🖼️ 사진 照片</button>
      <button class="d" data-go="date">📅 날짜별 依日期</button>
      <label style="margin-top:22px">맞춤 설정 自訂設定</label>
      <label>👤 애칭 설정 暱稱</label>
      <input type="text" id="nickInput" maxlength="20">
      <label>🖼️ 배경 설정 背景色</label>
      <div class="sw" id="swatches"></div>
    </div>
  </div>

  <div id="lb" hidden><img alt=""></div>
</div>

/* ============ 以下是程式，新手不用改 ============ */
const $ = s => document.querySelector(s);
const COLORS = {"연초록 淡綠":"#E4F1E1","연보라 淡紫":"#ECE6F6","연분홍 淡粉":"#F9E6EC","연하늘 淡藍":"#E3EEF8"};
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
let nick = store.get("nick") || CONFIG.name;
let view = "home";

const WD = ["일","월","화","수","목","금","토"], WZ = ["日","一","二","三","四","五","六"];
function fmtDate(s){
  const [y,m,d] = s.split("-").map(Number), w = new Date(y,m-1,d).getDay();
  return `${y}年${m}月${d}日 星期${WZ[w]}`;
}
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }
function imgTag(src){
  return `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>找不到圖片<br>${esc(src)}</div>'">`;
}

function renderChat(){
  let html = "", lastDay = "";
  MESSAGES.forEach((m,i) => {            // d 或 t 留空 = 沿用上一則的日期／時間
    if(i === 0) return;
    const p = MESSAGES[i-1];
    if(!m.d) m.d = p.d;
    if(!m.t && m.d === p.d) m.t = p.t;
  });
  MESSAGES.forEach((m,i) => {
    if(m.d !== lastDay){
      html += `<div class="day" id="d-${m.d}"><span>${fmtDate(m.d)}</span></div>`;
      lastDay = m.d;
    }
    const prev = MESSAGES[i-1], first = !prev || prev.d !== m.d || prev.t !== m.t;
    const zh = t => t && CONFIG.showZh ? `<span class="zh">${esc(t)}</span>` : "";
    const body = m.img
      ? `<div class="bubble photo" data-img="${esc(m.img)}">${imgTag(m.img)}</div>`
      : m.q
      ? `<div class="bubble reply"><div class="rh">${esc(nick)}님의 답장</div><div class="rq">${esc(m.q)}${zh(m.qzh)}</div><div class="ra"><span class="arr">↳</span><span>${esc(m.ko)}${zh(m.zh)}</span></div></div>`
      : `<div class="bubble">${esc(m.ko)}${zh(m.zh)}</div>`;
    const head = first
      ? `<div class="nick"><b>${esc(nick)}</b>${CONFIG.verified ? `<span class="badge">✓</span>` : ""}<span class="time">${esc(m.t)}</span></div>`
      : "";
    html += `<div class="row${first ? " first" : ""}">${first ? `<img class="avatar" src="${esc(CONFIG.profile)}" alt="">` : `<div class="gap"></div>`}
      <div class="col">${head}<div class="line">${body}</div></div></div>`;
  });
  $("#msgs").innerHTML = html;
}
function renderPhotos(){
  const ph = MESSAGES.filter(m => m.img);
  $("#photos").innerHTML = ph.length
    ? `<div class="grid">${ph.map(m => `<div data-img="${esc(m.img)}">${imgTag(m.img)}</div>`).join("")}</div>`
    : `<p class="empty">아직 사진이 없어요<br>還沒有照片</p>`;
}
function renderDates(){
  const days = [...new Set(MESSAGES.map(m => m.d))];
  $("#dateList").innerHTML = days.map(d => `<li><button class="d" data-day="${d}">${fmtDate(d)}</button></li>`).join("");
}
function daysTogether(){
  const [y,m,d] = CONFIG.startDate.split("-").map(Number);
  const n = Math.floor((Date.now() - new Date(y,m-1,d)) / 864e5) + 1;
  return Math.max(n,1);
}
function refreshHead(){
  $("#topName").textContent = nick;
  $("#topDays").textContent = `❤️ 함께한지 ${daysTogether()}일 · 在一起第 ${daysTogether()} 天`;
  $("#panelName").textContent = nick;
  $("#panelDays").textContent = $("#topDays").textContent;
}

function show(v){
  view = v;
  const inHome = v === "home";
  $("#home").hidden = !inHome;
  $("#top").hidden = $("#nav").hidden = inHome;
  $("#msgs").hidden = $("#fakeInput").hidden = v !== "chat";
  $("#photos").hidden = v !== "photos";
  document.querySelectorAll(".nav button").forEach((b,i) =>
    b.classList.toggle("on", ["home","chat","photos","date"][i] === v));
  if(v === "chat") $("#msgs").scrollTop = $("#msgs").scrollHeight;
}
function applyBg(c){
  document.documentElement.style.setProperty("--bg", c);
  document.querySelectorAll("#swatches button").forEach(b => b.classList.toggle("on", b.dataset.c === c));
}

/* 事件 */
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if(go){
    $("#setSheet").hidden = true;
    if(go.dataset.go === "date"){ $("#dateSheet").hidden = false; return; }
    show(go.dataset.go); return;
  }
  const day = e.target.closest("[data-day]");
  if(day){
    $("#dateSheet").hidden = true; show("chat");
    const el = document.getElementById("d-" + day.dataset.day);
    if(el) $("#msgs").scrollTop = el.offsetTop - 8;
    return;
  }
  const im = e.target.closest("[data-img]");
  if(im && e.target.tagName === "IMG"){ $("#lb img").src = im.dataset.img; $("#lb").hidden = false; return; }
  if(e.target.closest("#lb")){ $("#lb").hidden = true; return; }
  if(e.target.id === "dateSheet" || e.target.id === "closeDate") $("#dateSheet").hidden = true;
  if(e.target.id === "setSheet" || e.target.id === "closeSet") $("#setSheet").hidden = true;
  if(e.target.id === "openSet") $("#setSheet").hidden = false;
});
$("#nickInput").addEventListener("input", e => {
  nick = e.target.value.trim() || CONFIG.name;
  store.set("nick", nick); refreshHead(); renderChat();
});

/* 初始化 */
$("#homeTitle").textContent = CONFIG.title;
$("#contact").textContent = CONFIG.contact;
$("#topAvatar").src = CONFIG.profile;
$("#panelAvatar").src = CONFIG.profile;
$("#nickInput").value = nick;
$("#swatches").innerHTML = Object.entries(COLORS).map(([n,c]) =>
  `<button data-c="${c}" title="${n}" style="background:${c}"></button>`).join("");
$("#swatches").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  store.set("bg", b.dataset.c); applyBg(b.dataset.c);
});
applyBg(store.get("bg") || "#E4F1E1");
refreshHead(); renderChat(); renderPhotos(); renderDates(); show("home");
</script>
</body>
</html>
